# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
    reasoningEffort: max
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
    fontSize: 15
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
        retryPolicy:
          mode: always
          backoff:
            initialDelayMs: 2000
            maxDelayMs: 120000
            jitterRatio: 0.2
        timeoutMs: 900000
        streamIdleTimeoutMs: 900000

# --- private remote access (2026-11-09) — see ~/remote-access/README.md ---
# Remote access (2026-11-09): serve the Web GUI behind the cartonzone edge proxy at a
# private path, and admit that authority in the /api Host/Origin fence. The browser
# cookie is long-lived because a fresh launch token requires restarting the DSH host.
- id: web-runtime
  config:
    publicUrl: https://remote.cartonzone.shop/8iHrX6-SCOcBb-fA1lD951cE1Hv-3TAigbmEGL-GXjjoCbde/
    openBrowser: false
- id: connection
  config:
    trustedHosts:
      - remote.cartonzone.shop
    cookieMaxAgeDays: 365
